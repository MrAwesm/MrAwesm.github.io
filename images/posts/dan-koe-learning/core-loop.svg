<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="620" height="420" rx="16" fill="#f8fafc"/>

  <!-- WHY node -->
  <rect x="40" y="160" width="120" height="56" rx="12" fill="#eef2ff" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">WHY</text>
  <text x="100" y="202" text-anchor="middle" font-size="10" fill="#3b82f6">理想地图</text>

  <!-- WHAT node -->
  <rect x="250" y="160" width="120" height="56" rx="12" fill="#e8f5e9" stroke="#22c55e" stroke-width="2"/>
  <text x="310" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">WHAT</text>
  <text x="310" y="202" text-anchor="middle" font-size="10" fill="#22c55e">项目</text>

  <!-- HOW node -->
  <rect x="460" y="160" width="120" height="56" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="520" y="185" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">HOW</text>
  <text x="520" y="202" text-anchor="middle" font-size="10" fill="#f59e0b">构建中搜索</text>

  <!-- SOLIDIFY node -->
  <rect x="250" y="310" width="120" height="56" rx="12" fill="#fce4ec" stroke="#ef4444" stroke-width="2"/>
  <text x="310" y="333" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">SOLIDIFY</text>
  <text x="310" y="350" text-anchor="middle" font-size="10" fill="#ef4444">写作/教学</text>

  <!-- FEEDBACK node -->
  <rect x="40" y="310" width="120" height="56" rx="12" fill="#f3e5f5" stroke="#a855f7" stroke-width="2"/>
  <text x="100" y="333" text-anchor="middle" font-size="13" font-weight="600" fill="#6b21a8">FEEDBACK</text>
  <text x="100" y="350" text-anchor="middle" font-size="10" fill="#a855f7">公开分享</text>

  <!-- Arrows: WHY -> WHAT -->
  <line x1="160" y1="188" x2="248" y2="188" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrows: WHAT -> HOW -->
  <line x1="370" y1="188" x2="458" y2="188" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrows: HOW -> SOLIDIFY (down) -->
  <path d="M 520 216 L 520 260 Q 520 280 500 280 L 372 280 L 372 308" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Arrows: SOLIDIFY -> FEEDBACK -->
  <line x1="250" y1="338" x2="162" y2="338" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrows: FEEDBACK -> WHY (up, closing loop) -->
  <path d="M 60 310 L 60 260 Q 60 240 80 240 L 100 240 L 100 218" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrowBlue)" stroke-dasharray="6,3"/>

  <!-- Label on feedback arrow -->
  <text x="28" y="268" font-size="10" fill="#2563eb" font-weight="500">循环加速</text>

  <!-- Title -->
  <text x="310" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">学习加速核心循环</text>
  <text x="310" y="62" text-anchor="middle" font-size="12" fill="#94a3b8">反馈网络 · 不是线性步骤</text>

  <!-- Subtitle hint -->
  <text x="310" y="400" text-anchor="middle" font-size="11" fill="#94a3b8">传统学习 6 个月一个循环 → 这套方法几分钟到几小时一个循环</text>
</svg>
