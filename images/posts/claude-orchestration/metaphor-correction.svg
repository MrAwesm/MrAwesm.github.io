<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF8F5"/>
      <stop offset="1" stop-color="#F0EDE8"/>
    </linearGradient>
  </defs>
  <rect width="780" height="380" fill="url(#bg7)"/>
  <text x="390" y="32" font-size="18" font-weight="bold" fill="#2D3748" text-anchor="middle">比喻修正：电影组 → 项目外包</text>

  <!-- 左：旧比喻 -->
  <rect x="40" y="60" width="340" height="280" rx="10" fill="#FFFFFF" stroke="#E8A45C" stroke-width="2"/>
  <rect x="40" y="60" width="340" height="38" rx="10" fill="#E8A45C"/>
  <text x="210" y="84" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">旧比喻：电影组（不够准确）</text>

  <rect x="65" y="118" width="290" height="58" rx="6" fill="#FFF8EE"/>
  <text x="75" y="138" font-size="12" fill="#2D3748" font-weight="bold">🎬 Command = 导演</text>
  <text x="75" y="158" font-size="10" fill="#9C5C2E">✗ 导演按剧本拍，Command 可跳过步骤</text>

  <rect x="65" y="186" width="290" height="58" rx="6" fill="#FFF8EE"/>
  <text x="75" y="206" font-size="12" fill="#2D3748" font-weight="bold">🎭 Agent = 演员</text>
  <text x="75" y="226" font-size="10" fill="#9C5C2E">✗ 演员有创作自由，Agent 严格约束</text>

  <rect x="65" y="254" width="290" height="58" rx="6" fill="#FFF8EE"/>
  <text x="75" y="274" font-size="12" fill="#2D3748" font-weight="bold">📜 Skill = 剧本</text>
  <text x="75" y="294" font-size="10" fill="#9C5C2E">✗ 剧本是死的，Skill 是活跃执行流程</text>

  <!-- 右：新比喻 -->
  <rect x="400" y="60" width="340" height="280" rx="10" fill="#FFFFFF" stroke="#5A9A8A" stroke-width="2"/>
  <rect x="400" y="60" width="340" height="38" rx="10" fill="#5A9A8A"/>
  <text x="570" y="84" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">新比喻：项目外包（更准确）</text>

  <rect x="425" y="118" width="290" height="58" rx="6" fill="#EEF6F3"/>
  <text x="435" y="138" font-size="12" fill="#2D3748" font-weight="bold">📋 Command = 发包的</text>
  <text x="435" y="158" font-size="10" fill="#3A6B5F">✓ 分配任务、控制顺序、不亲自做</text>

  <rect x="425" y="186" width="290" height="58" rx="6" fill="#EEF6F3"/>
  <text x="435" y="206" font-size="12" fill="#2D3748" font-weight="bold">👷 Agent = 干活的</text>
  <text x="435" y="226" font-size="10" fill="#3A6B5F">✓ 拿权限去做、按合同执行</text>

  <rect x="425" y="254" width="290" height="58" rx="6" fill="#EEF6F3"/>
  <text x="435" y="274" font-size="12" fill="#2D3748" font-weight="bold">📖 Skill = 查资料的</text>
  <text x="435" y="294" font-size="10" fill="#3A6B5F">✓ 工具书，需要时翻，可改可跳</text>

  <text x="390" y="365" font-size="11" fill="#718096" text-anchor="middle">权力方向修正：Skill 非终极真理 — 是 Command 手里的分镜脚本</text>
</svg>
