<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" font-family="system-ui, sans-serif">
  <!-- 标题 -->
  <text x="425" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#37474F">Agent Memory 三种 Scope 存储位置</text>

  <!-- user scope -->
  <rect x="30" y="70" width="260" height="200" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
  <text x="160" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D32">user scope</text>
  <text x="160" y="115" text-anchor="middle" font-size="11" fill="#616161">跨项目通用</text>

  <rect x="50" y="135" width="220" height="50" rx="4" fill="#C8E6C9" stroke="#66BB6A" stroke-width="1"/>
  <text x="160" y="155" text-anchor="middle" font-size="10" fill="#424242">~/.claude/agent-memory/</text>
  <text x="160" y="170" text-anchor="middle" font-size="10" fill="#424242">&lt;memory-name&gt;/</text>

  <rect x="50" y="195" width="220" height="55" rx="4" fill="#FFF" stroke="#81C784" stroke-width="1"/>
  <text x="160" y="215" text-anchor="middle" font-size="11" fill="#2E7D32">❌ 不提交到 Git</text>
  <text x="160" y="235" text-anchor="middle" font-size="10" fill="#757575">个人跨项目知识库</text>

  <rect x="90" y="260" width="140" height="25" rx="12" fill="#43A047"/>
  <text x="160" y="278" text-anchor="middle" font-size="11" fill="#FFF" font-weight="bold">✓ 推荐默认</text>

  <!-- project scope -->
  <rect x="310" y="70" width="260" height="200" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="440" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#0D47A1">project scope</text>
  <text x="440" y="115" text-anchor="middle" font-size="11" fill="#616161">项目特定</text>

  <rect x="330" y="135" width="220" height="50" rx="4" fill="#BBDEFB" stroke="#64B5F6" stroke-width="1"/>
  <text x="440" y="155" text-anchor="middle" font-size="10" fill="#424242">.claude/agent-memory/</text>
  <text x="440" y="170" text-anchor="middle" font-size="10" fill="#424242">&lt;memory-name&gt;/</text>

  <rect x="330" y="195" width="220" height="55" rx="4" fill="#FFF" stroke="#90CAF9" stroke-width="1"/>
  <text x="440" y="215" text-anchor="middle" font-size="11" fill="#1565C0">✅ 提交到 Git</text>
  <text x="440" y="235" text-anchor="middle" font-size="10" fill="#757575">团队共享项目经验</text>

  <rect x="370" y="260" width="140" height="25" rx="12" fill="#1565C0"/>
  <text x="440" y="278" text-anchor="middle" font-size="11" fill="#FFF" font-weight="bold">团队协作</text>

  <!-- local scope -->
  <rect x="590" y="70" width="260" height="200" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="720" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A148C">local scope</text>
  <text x="720" y="115" text-anchor="middle" font-size="11" fill="#616161">个人临时</text>

  <rect x="610" y="135" width="220" height="50" rx="4" fill="#E1BEE7" stroke="#BA68C8" stroke-width="1"/>
  <text x="720" y="155" text-anchor="middle" font-size="10" fill="#424242">.claude/agent-memory-local/</text>
  <text x="720" y="170" text-anchor="middle" font-size="10" fill="#424242">&lt;memory-name&gt;/</text>

  <rect x="610" y="195" width="220" height="55" rx="4" fill="#FFF" stroke="#CE93D8" stroke-width="1"/>
  <text x="720" y="215" text-anchor="middle" font-size="11" fill="#7B1FA2">❌ 不提交 (git-ignored)</text>
  <text x="720" y="235" text-anchor="middle" font-size="10" fill="#757575">个人调试笔记</text>

  <rect x="650" y="260" width="140" height="25" rx="12" fill="#7B1FA2"/>
  <text x="720" y="278" text-anchor="middle" font-size="11" fill="#FFF" font-weight="bold">临时调试</text>
</svg>