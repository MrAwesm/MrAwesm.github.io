<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowGrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="540" height="400" rx="16" fill="#f8fafc"/>

  <!-- Title -->
  <text x="270" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">最近发展区 (ZPD)</text>

  <!-- Panic zone (outer) -->
  <rect x="60" y="60" width="420" height="240" rx="20" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <!-- Panic label — top right, fully inside zone but above middle zone -->
  <text x="460" y="85" text-anchor="end" font-size="13" font-weight="600" fill="#ef4444">恐慌区</text>
  <text x="460" y="101" text-anchor="end" font-size="10" fill="#f87171">太难 → 挫折 → 放弃</text>

  <!-- Learning zone (middle) -->
  <rect x="110" y="115" width="320" height="150" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <!-- Learning label — top right of this zone -->
  <text x="410" y="140" text-anchor="end" font-size="13" font-weight="600" fill="#16a34a">学习区</text>
  <text x="410" y="156" text-anchor="end" font-size="10" fill="#4ade80">恰到好处 → 挣扎 → 学会</text>

  <!-- Comfort zone (inner) -->
  <rect x="170" y="170" width="200" height="65" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="270" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">舒适区</text>
  <text x="270" y="218" text-anchor="middle" font-size="10" fill="#60a5fa">太简单 → 无聊</text>

  <!-- Sweet spot — in learning zone, below comfort zone -->
  <circle cx="200" cy="240" r="16" fill="#22c55e" opacity="0.25" stroke="#22c55e" stroke-width="2"/>
  <text x="200" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">你</text>
  <text x="200" y="264" text-anchor="middle" font-size="9" fill="#22c55e" font-weight="500">最佳位置</text>

  <!-- Growth arrow -->
  <line x1="270" y1="275" x2="270" y2="310" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowGrow)"/>
  <text x="295" y="300" font-size="10" fill="#6b7280">项目难度递增</text>

  <!-- Self-check bar -->
  <rect x="60" y="340" width="420" height="40" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="270" y="365" text-anchor="middle" font-size="11" fill="#92400e">自检：卡住 30 分钟后搜到的答案都看不懂 → 掉出学习区，项目太大</text>
</svg>
