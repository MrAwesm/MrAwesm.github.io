<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="580" height="300" rx="16" fill="#f8fafc"/>

  <!-- Title -->
  <text x="290" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">反馈密度对比</text>

  <!-- LEFT: Traditional -->
  <text x="145" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#94a3b8">传统学习</text>

  <!-- Timeline -->
  <line x1="30" y1="100" x2="270" y2="100" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>

  <!-- Learn blocks -->
  <rect x="40" y="82" width="55" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="67" y="105" text-anchor="middle" font-size="10" fill="#94a3b8">学</text>

  <rect x="100" y="82" width="55" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="127" y="105" text-anchor="middle" font-size="10" fill="#94a3b8">学</text>

  <rect x="160" y="82" width="55" height="36" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="187" y="105" text-anchor="middle" font-size="10" fill="#94a3b8">学</text>

  <!-- Time gap -->
  <text x="240" y="105" text-anchor="middle" font-size="18" fill="#cbd5e1">…</text>

  <!-- Build block (far right) -->
  <rect x="40" y="140" width="230" height="40" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="155" y="164" text-anchor="middle" font-size="11" fill="#ef4444">6 个月后做项目 → 发现全忘了</text>

  <!-- Feedback arrow -->
  <line x1="145" y1="125" x2="145" y2="138" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="145" y="198" text-anchor="middle" font-size="10" fill="#94a3b8">反馈周期：6 个月</text>

  <!-- Divider -->
  <line x1="285" y1="55" x2="285" y2="220" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- RIGHT: Dan Koe -->
  <text x="435" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">Dan Koe 方法</text>

  <!-- Timeline -->
  <line x1="310" y1="100" x2="555" y2="100" stroke="#bfdbfe" stroke-width="3" stroke-linecap="round"/>

  <!-- Rapid cycles -->
  <rect x="315" y="82" width="36" height="36" rx="6" fill="#eef2ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="333" y="104" text-anchor="middle" font-size="9" fill="#2563eb">做</text>

  <rect x="356" y="82" width="36" height="36" rx="6" fill="#fff7ed" stroke="#fbbf24" stroke-width="1"/>
  <text x="374" y="104" text-anchor="middle" font-size="9" fill="#d97706">卡</text>

  <rect x="397" y="82" width="36" height="36" rx="6" fill="#e8f5e9" stroke="#86efac" stroke-width="1"/>
  <text x="415" y="104" text-anchor="middle" font-size="9" fill="#16a34a">搜</text>

  <rect x="438" y="82" width="36" height="36" rx="6" fill="#eef2ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="456" y="104" text-anchor="middle" font-size="9" fill="#2563eb">做</text>

  <rect x="479" y="82" width="36" height="36" rx="6" fill="#fff7ed" stroke="#fbbf24" stroke-width="1"/>
  <text x="497" y="104" text-anchor="middle" font-size="9" fill="#d97706">卡</text>

  <rect x="520" y="82" width="36" height="36" rx="6" fill="#e8f5e9" stroke="#86efac" stroke-width="1"/>
  <text x="538" y="104" text-anchor="middle" font-size="9" fill="#16a34a">搜</text>

  <!-- Rapid cycle label -->
  <text x="435" y="140" text-anchor="middle" font-size="10" fill="#2563eb">每个循环几分钟到几小时</text>

  <!-- Cycle arrows -->
  <path d="M 333 120 Q 333 132 374 132 Q 415 132 415 120" stroke="#93c5fd" stroke-width="1" fill="none" marker-end="url(#arrowCycle2)"/>
  <path d="M 456 120 Q 456 132 497 132 Q 538 132 538 120" stroke="#93c5fd" stroke-width="1" fill="none" marker-end="url(#arrowCycle2)"/>
  <defs>
    <marker id="arrowCycle2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- Result -->
  <rect x="320" y="155" width="230" height="40" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="435" y="179" text-anchor="middle" font-size="11" fill="#166534">学完就能用 → 知识归档 → 持续迭代</text>

  <text x="435" y="218" text-anchor="middle" font-size="10" fill="#2563eb" font-weight="500">反馈周期：几分钟到几小时</text>

  <!-- Bottom comparison -->
  <rect x="80" y="248" width="420" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="290" y="271" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="500">本质区别：不是学得"快"，是反馈密度高 100 倍</text>
</svg>
