<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 360" font-family="system-ui, sans-serif">
  <!-- 标题 -->
  <text x="375" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#37474F">系统可见性矩阵</text>

  <!-- 列标题（上下文） -->
  <rect x="140" y="45" width="120" height="35" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1.5"/>
  <text x="200" y="67" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">主会话</text>

  <rect x="270" y="45" width="120" height="35" rx="4" fill="#FFF3E0" stroke="#EF6C00" stroke-width="1.5"/>
  <text x="330" y="67" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">Subagent</text>

  <rect x="400" y="45" width="120" height="35" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="460" y="67" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D47A1">Skill</text>

  <rect x="530" y="45" width="170" height="35" rx="4" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="615" y="67" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A148C">加载时机</text>

  <!-- 行标题（系统） -->
  <text x="70" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#37474F">CLAUDE.md</text>
  <text x="70" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#37474F">Rules(无paths)</text>
  <text x="70" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#37474F">Rules(有paths)</text>
  <text x="70" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#37474F">Auto Memory</text>
  <text x="70" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#37474F">Agent Memory</text>
  <text x="70" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#37474F">预加载Skills</text>

  <!-- CLAUDE.md 行 -->
  <circle cx="200" cy="110" r="18" fill="#43A047"/>
  <text x="200" y="115" text-anchor="middle" font-size="11" fill="#FFF">✓</text>
  <circle cx="330" cy="110" r="18" fill="#43A047"/>
  <text x="330" y="115" text-anchor="middle" font-size="11" fill="#FFF">✓注入</text>
  <circle cx="460" cy="110" r="18" fill="#43A047"/>
  <text x="460" y="115" text-anchor="middle" font-size="11" fill="#FFF">✓</text>
  <text x="615" y="115" text-anchor="middle" font-size="11" fill="#616161">会话启动</text>

  <!-- Rules(无paths) 行 -->
  <circle cx="200" cy="150" r="18" fill="#1565C0"/>
  <text x="200" y="155" text-anchor="middle" font-size="11" fill="#FFF">✓</text>
  <circle cx="330" cy="150" r="18" fill="#BDBDBD"/>
  <text x="330" y="155" text-anchor="middle" font-size="10" fill="#FFF">✗</text>
  <circle cx="460" cy="150" r="18" fill="#1565C0"/>
  <text x="460" y="155" text-anchor="middle" font-size="11" fill="#FFF">✓</text>
  <text x="615" y="155" text-anchor="middle" font-size="11" fill="#616161">会话启动</text>

  <!-- Rules(有paths) 行 -->
  <circle cx="200" cy="190" r="18" fill="#1565C0"/>
  <text x="200" y="195" text-anchor="middle" font-size="10" fill="#FFF">✓触发</text>
  <circle cx="330" cy="190" r="18" fill="#BDBDBD"/>
  <text x="330" y="195" text-anchor="middle" font-size="10" fill="#FFF">✗</text>
  <circle cx="460" cy="190" r="18" fill="#1565C0"/>
  <text x="460" y="195" text-anchor="middle" font-size="10" fill="#FFF">✓触发</text>
  <text x="615" y="195" text-anchor="middle" font-size="11" fill="#616161">文件匹配时</text>

  <!-- Auto Memory 行 -->
  <circle cx="200" cy="230" r="18" fill="#EF6C00"/>
  <text x="200" y="235" text-anchor="middle" font-size="11" fill="#FFF">✓</text>
  <circle cx="330" cy="230" r="18" fill="#BDBDBD"/>
  <text x="330" y="235" text-anchor="middle" font-size="10" fill="#FFF">✗</text>
  <circle cx="460" cy="230" r="18" fill="#EF6C00"/>
  <text x="460" y="235" text-anchor="middle" font-size="11" fill="#FFF">✓</text>
  <text x="615" y="235" text-anchor="middle" font-size="11" fill="#616161">会话启动</text>

  <!-- Agent Memory 行 -->
  <circle cx="200" cy="270" r="18" fill="#BDBDBD"/>
  <text x="200" y="275" text-anchor="middle" font-size="10" fill="#FFF">✗</text>
  <circle cx="330" cy="270" r="18" fill="#7B1FA2"/>
  <text x="330" y="275" text-anchor="middle" font-size="10" fill="#FFF">✓自己</text>
  <circle cx="460" cy="270" r="18" fill="#BDBDBD"/>
  <text x="460" y="275" text-anchor="middle" font-size="10" fill="#FFF">✗</text>
  <text x="615" y="275" text-anchor="middle" font-size="11" fill="#616161">Agent启动(前200行)</text>

  <!-- 预加载Skills 行 -->
  <circle cx="200" cy="310" r="18" fill="#BDBDBD"/>
  <text x="200" y="315" text-anchor="middle" font-size="10" fill="#FFF">✗</text>
  <circle cx="330" cy="310" r="18" fill="#7B1FA2"/>
  <text x="330" y="315" text-anchor="middle" font-size="11" fill="#FFF">✓</text>
  <text x="460" y="315" text-anchor="middle" font-size="10" fill="#757575">—</text>
  <text x="615" y="315" text-anchor="middle" font-size="11" fill="#616161">Agent启动时注入</text>

  <!-- 关键标注 -->
  <rect x="50" y="335" width="700" height="25" rx="4" fill="#E8F5E9" stroke="#43A047" stroke-width="1"/>
  <text x="375" y="352" text-anchor="middle" font-size="11" fill="#1B5E20" font-weight="bold">🔑 唯一跨两层可见：CLAUDE.md。设计跨层级约束时放 CLAUDE.md 最可靠</text>
</svg>